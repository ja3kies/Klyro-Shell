name: Android build

on:
  push:
    branches: [feat/production-ready-terminal, main, chore/android-api-36, feat/terminal-keyboard-ux, feat/klyro-0110, fix/klyro-hi-terminal-resilience-20261106, fix/klyro-critical-session-20261107, feature/klyro-storage-ux-20261107, feature/klyro-multistorage-bento-monochrome-20261107, fix/klyro-acceptance-apple-slider-20261107, fix/klyro-hugeicons-audit-20261107, fix/klyro-visual-copy-components-20261107, fix/klyro-adversarial-ux-icons-20261108, fix/klyro-adversarial-final-20261108, feat/klyro-compact-sheets-plugins-20261108, feat/klyro-ux-systematic-audit-20261108, feat/klyro-dual-brand-smart-all-20261108, feat/p0-cycle1-25-actions-20261108, 'p0/**', 'p1/**', 'integration/**', 'feat/ux-five-priorities-cycle-02', 'fix/ux-t4-confirm-bundled-install', 'p1/ux-modal-keyboard-cycle-03', 'p0/select-paste-adversarial-audit-20261109']
    paths-ignore:
      # The fast robot-quality-gate workflow validates these changes
      # independently. Don't consume a full Android/Termux SDK build for
      # every non-APK QA script, regression fixture or QA documentation edit.
      - 'tools/klyro_ui_robot.py'
      - 'tools/klyro_robot_report_audit.py'
      - 'tools/klyro_ux_report.py'
      - 'tools/test_klyro_ui_robot.py'
      - 'tools/test_klyro_robot_capture.py'
      - 'tools/test_klyro_robot_report_audit.py'
      - 'tools/test_klyro_ux_report.py'
      - 'tools/test_klyro_ux_report_source_contract.py'
      - 'tools/test_klyro_robot_accessibility_contract.py'
      - 'scripts/klyro-qa.sh'
      - 'scripts/klyro-qa-bootstrap.sh'
      - 'docs/AUTOMATED_UX_QA.md'
      - 'docs/PRODUCTION_READINESS_20261112.md'
      - 'docs/validation/production-20261112/**'
      - '.github/workflows/robot-quality-gate.yml'
  pull_request:
    branches: [main, feat/klyro-0110, 'integration/**']
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signed ARM64 PRoot runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_proot_runtime.py "$RUNNER_TEMP/klyro-runtime"
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -R "$RUNNER_TEMP/klyro-runtime/jniLibs/." app/src/main/jniLibs/
          cp -R "$RUNNER_TEMP/klyro-runtime/assets/." app/src/main/assets/
          for lib in app/src/main/jniLibs/arm64-v8a/*.so; do
            readelf -h "$lib" | grep -q 'AArch64'
          done
          readelf -d app/src/main/jniLibs/arm64-v8a/libtalloc.so | grep -q 'SONAME.*libtalloc.so.2'
          cat app/src/main/assets/proot/runtime-manifest.txt

      # A pinned and verified open-font licence asset; no remote typography
      # package or UI code is imported from DSH Go.
      - name: Prepare verified JetBrains Mono terminal font
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="20447ce63b9ce38ab1757d14137467f7d268224a"
          FONT_DIR="app/src/main/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/ccch1mneyyy/dsh-Go/$SOURCE_COMMIT/app/assets/fonts/JetBrainsMono-Regular.ttf" \
            --output "$FONT_DIR/JetBrainsMono-Regular.ttf"
          test "$(git hash-object "$FONT_DIR/JetBrainsMono-Regular.ttf")" = \
            "dff66cc50702c75abd025dcf49f62a4dcc2d72de"
          test "$(git hash-object "$FONT_DIR/OFL.txt")" = \
            "8bee4148c1d54dbf5dae6d6c117fc80414266abb"
          test "$(wc -c < "$FONT_DIR/JetBrainsMono-Regular.ttf")" -eq 273900
          echo "PASS: verified JetBrains Mono and OFL licence"

      - name: Run JVM and native alignment auditor unit tests
        run: |
          bash -n scripts/klyro-operational-gate.sh
          bash scripts/test-native-pty.sh
          bash -n scripts/klyro-qa.sh
          bash -n scripts/klyro-qa-bootstrap.sh
          python3 -m py_compile tools/klyro_ui_robot.py tools/klyro_robot_report_audit.py tools/klyro_ux_report.py
          python3 -m unittest discover -s tools -p "test_*.py"
          gradle :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest

      - name: Android lint and UI accessibility checks
        run: gradle :app:lintDebug

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build ARM64 debug APK and instrumented test APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Verify packaged APK metadata and native runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          PACKAGE_INFO="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$PACKAGE_INFO" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          grep -Fq "name='com.klyro.shell'" <<< "$PACKAGE_INFO"
          grep -Fq "targetSdkVersion:'36'" <<< "$PACKAGE_INFO"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          for entry in \
            lib/arm64-v8a/libproot.so \
            lib/arm64-v8a/libproot-loader.so \
            lib/arm64-v8a/libtalloc.so \
            lib/arm64-v8a/libandroid-shmem.so \
            assets/proot/runtime-manifest.txt \
            assets/fonts/JetBrainsMono-Regular.ttf \
            assets/fonts/OFL.txt \
            assets/licenses/hugeicons-MIT.txt; do
            grep -Fxq "$entry" <<< "$APK_ENTRIES" || {
              echo "Required runtime file missing from APK: $entry" >&2
              exit 1
            }
          done
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Audit 16 KiB native page alignment
        run: |
          python3 tools/audit_apk_16k.py \
            app/build/outputs/apk/debug/app-debug.apk \
            --report "$RUNNER_TEMP/native-16kb.md" --strict

      - name: Upload native page-size audit
        uses: actions/upload-artifact@v4
        with:
          name: native-16kb-audit
          path: ${{ runner.temp }}/native-16kb.md
          if-no-files-found: error
          retention-days: 14

      - name: Detect optional signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KLYRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KLYRO_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KLYRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLYRO_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" && -n "$KEY_ALIAS" ]]; then
            echo "KLYRO_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "KLYRO_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signing credentials unavailable; standard Android debug-key APK retained for CI."
          fi

      - name: Verify standard debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug-key APK for CI validation
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-debug-key
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumented debug-key APK
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-tests-debug-key
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign APK with Klyro certificate
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KLYRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KLYRO_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KLYRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLYRO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
            test -n "${!value}" || { echo "Missing signing secret: $value"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/klyro.p12"
          chmod 600 "$RUNNER_TEMP/klyro.p12"
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/klyro.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out app/build/outputs/apk/debug/klyro-shell-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/klyro-shell-signed.apk
          "$SDK_TOOLS/zipalign" -f 4 app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/aligned-tests.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/klyro.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk "$RUNNER_TEMP/aligned-tests.apk"
          "$SDK_TOOLS/apksigner" verify --verbose app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk
          rm app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed debug APK
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumented APK with matching Klyro certificate
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-tests
          path: app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk
          if-no-files-found: error
          retention-days: 14
