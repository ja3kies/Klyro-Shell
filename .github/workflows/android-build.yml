name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      # The fast robot-quality-gate workflow validates these changes
      # independently. Don't consume a full Android/Termux SDK build for
      # every non-APK QA script, regression fixture or QA documentation edit.
      - 'tools/klyro_ui_robot.py'
      - 'tools/klyro_robot_report_audit.py'
      - 'tools/klyro_ux_report.py'
      - 'tools/test_klyro_ui_robot.py'
      - 'tools/test_klyro_robot_capture.py'
      - 'tools/test_klyro_robot_report_audit.py'
      - 'tools/test_klyro_ux_report.py'
      - 'tools/test_klyro_ux_report_source_contract.py'
      - 'tools/test_klyro_robot_accessibility_contract.py'
      - 'scripts/klyro-qa.sh'
      - 'scripts/klyro-qa-bootstrap.sh'
      - 'docs/AUTOMATED_UX_QA.md'
      - 'docs/TERMUX_PARITY_ENGINEERING.md'
      - 'docs/validation/termux-parity/**'
      - 'docs/MODAL_LIFECYCLE_AUDIT.md'
      - 'docs/MODAL_TOUCH_FREEZE_CLOSURE.md'
      - 'docs/validation/modal-touch/**'
      - 'docs/FREEZE_FORENSICS.md'
      - 'docs/UX_FUNCTIONAL_AUDIT.md'
      - 'docs/KLYRO_UX_FREEZE_COMPLETION.md'
      - 'docs/validation/freeze-ux/**'
      - 'docs/P0_RELIABILITY_PROGRESS.md'
      - 'docs/P0_RELIABILITY_CLOSURE.md'
      - 'docs/validation/p0-reliability/**'
      - 'docs/PRODUCTION_READINESS_20261112.md'
      - 'docs/validation/production-20261112/**'
      - '.github/workflows/robot-quality-gate.yml'
  pull_request:
    branches: [main, feat/klyro-0110, fix/terminal-session-tab-actions-20261118, 'integration/**']
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and targeted regression gate
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci_targeted_tests.py tools/ci_build_report.py
          bash -n scripts/klyro-operational-gate.sh
          python3 tools/ci_targeted_tests.py

  debug-apk:
    needs: fast-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.ref_name != 'main' }}

      - name: Set release version name for semantic tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          echo "KLYRO_RELEASE_VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Prepare signed ARM64 PRoot runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_proot_runtime.py "$RUNNER_TEMP/klyro-runtime"
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -R "$RUNNER_TEMP/klyro-runtime/jniLibs/." app/src/main/jniLibs/
          cp -R "$RUNNER_TEMP/klyro-runtime/assets/." app/src/main/assets/
          for lib in app/src/main/jniLibs/arm64-v8a/*.so; do
            readelf -h "$lib" | grep -q 'AArch64'
          done
          readelf -d app/src/main/jniLibs/arm64-v8a/libtalloc.so | grep -q 'SONAME.*libtalloc.so.2'
          cat app/src/main/assets/proot/runtime-manifest.txt

      # A pinned and verified open-font licence asset; no remote typography
      # package or UI code is imported from DSH Go.
      - name: Prepare verified JetBrains Mono terminal font
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="20447ce63b9ce38ab1757d14137467f7d268224a"
          FONT_DIR="app/src/main/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/ccch1mneyyy/dsh-Go/$SOURCE_COMMIT/app/assets/fonts/JetBrainsMono-Regular.ttf" \
            --output "$FONT_DIR/JetBrainsMono-Regular.ttf"
          test "$(git hash-object "$FONT_DIR/JetBrainsMono-Regular.ttf")" = \
            "dff66cc50702c75abd025dcf49f62a4dcc2d72de"
          test "$(git hash-object "$FONT_DIR/OFL.txt")" = \
            "8bee4148c1d54dbf5dae6d6c117fc80414266abb"
          test "$(wc -c < "$FONT_DIR/JetBrainsMono-Regular.ttf")" -eq 273900
          echo "PASS: verified JetBrains Mono and OFL licence"

      - name: Prepare verified Source Code Pro terminal font
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="803b7e23ec97ae58b6232ea76519a76d428ba268"
          FONT_DIR="app/src/main/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/$SOURCE_COMMIT/TTF/SourceCodePro-Regular.ttf" \
            --output "$FONT_DIR/SourceCodePro-Regular.ttf"
          test "$(git hash-object "$FONT_DIR/SourceCodePro-Regular.ttf")" = "10c73d7d901cf0dfa8ba03e45e3271d466291520"
          test "$(wc -c < "$FONT_DIR/SourceCodePro-Regular.ttf")" -eq 210312
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/adobe-fonts/source-code-pro/$SOURCE_COMMIT/LICENSE.md" \
            --output "$FONT_DIR/SourceCodePro-OFL.txt"
          test "$(git hash-object "$FONT_DIR/SourceCodePro-OFL.txt")" = "70288a864f8dfd1314aa0315748eece0cf80fdda"
          echo "PASS: verified Source Code Pro and OFL licence"

      - name: Run JVM and native alignment auditor unit tests
        run: |
          bash -n scripts/klyro-operational-gate.sh
          bash scripts/test-native-pty.sh
          bash -n scripts/klyro-qa.sh
          bash -n scripts/klyro-qa-bootstrap.sh
          bash -n scripts/klyro-freeze-diagnostics.sh
          python3 -m py_compile tools/klyro_ui_robot.py tools/klyro_robot_report_audit.py tools/klyro_ux_report.py
          python3 -m unittest discover -s tools -p "test_*.py"
          gradle :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest

      - name: Upload behavioral test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-jvm-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            terminal-emulator/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK versions advance on a rerun and a new run
        shell: bash
        run: |
          set -euo pipefail
          first="$(GITHUB_RUN_NUMBER=100 GITHUB_RUN_ATTEMPT=1 gradle -q :app:printKlyroVersion)"
          retry="$(GITHUB_RUN_NUMBER=100 GITHUB_RUN_ATTEMPT=2 gradle -q :app:printKlyroVersion)"
          next="$(GITHUB_RUN_NUMBER=101 GITHUB_RUN_ATTEMPT=1 gradle -q :app:printKlyroVersion)"
          first_code="${first%%|*}"
          retry_code="${retry%%|*}"
          next_code="${next%%|*}"
          [[ "$first_code" =~ ^[0-9]+$ && "$retry_code" =~ ^[0-9]+$ && "$next_code" =~ ^[0-9]+$ ]]
          (( first_code < retry_code && retry_code < next_code ))
          baseline="$(GITHUB_ACTIONS=false gradle -q :app:printKlyroVersion)"
          base_code="${baseline%%|*}"
          base_name="${baseline#*|}"
          [[ "$base_code" =~ ^[0-9]+$ ]]
          [[ "$first" == "$((base_code + 10001))|${base_name}.100.1" ]]
          [[ "$retry" == "$((base_code + 10002))|${base_name}.100.2" ]]
          [[ "$next" == "$((base_code + 10101))|${base_name}.101.1" ]]

      - name: Android lint and UI accessibility checks
        run: gradle :app:lintDebug

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build ARM64 debug APK and instrumented test APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Verify packaged APK metadata and native runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          PACKAGE_INFO="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          EXPECTED_VERSION="$(gradle -q :app:printKlyroVersion)"
          IFS='|' read -r EXPECTED_CODE EXPECTED_NAME <<< "$EXPECTED_VERSION"
          [[ "$EXPECTED_CODE" =~ ^[0-9]+$ && -n "$EXPECTED_NAME" ]]
          printf '%s\n' "$PACKAGE_INFO" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          grep -Fq "name='com.klyro.shell'" <<< "$PACKAGE_INFO"
          grep -Fq "versionCode='$EXPECTED_CODE'" <<< "$PACKAGE_INFO"
          grep -Fq "versionName='$EXPECTED_NAME'" <<< "$PACKAGE_INFO"
          grep -Fq "targetSdkVersion:'36'" <<< "$PACKAGE_INFO"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          for entry in \
            lib/arm64-v8a/libproot.so \
            lib/arm64-v8a/libproot-loader.so \
            lib/arm64-v8a/libtalloc.so \
            lib/arm64-v8a/libandroid-shmem.so \
            assets/proot/runtime-manifest.txt \
            assets/fonts/JetBrainsMono-Regular.ttf \
            assets/fonts/SourceCodePro-Regular.ttf \
            assets/fonts/SourceCodePro-OFL.txt \
            assets/fonts/OFL.txt \
            assets/licenses/hugeicons-MIT.txt; do
            grep -Fxq "$entry" <<< "$APK_ENTRIES" || {
              echo "Required runtime file missing from APK: $entry" >&2
              exit 1
            }
          done
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Audit 16 KiB native page alignment
        run: |
          python3 tools/audit_apk_16k.py \
            app/build/outputs/apk/debug/app-debug.apk \
            --report "$RUNNER_TEMP/native-16kb.md" --strict

      - name: Upload native page-size audit
        uses: actions/upload-artifact@v4
        with:
          name: native-16kb-audit
          path: ${{ runner.temp }}/native-16kb.md
          if-no-files-found: error
          retention-days: 14

      - name: Detect optional signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KLYRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KLYRO_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KLYRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLYRO_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_PASS" && -n "$KEY_ALIAS" ]]; then
            echo "KLYRO_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "KLYRO_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Signing credentials unavailable; standard Android debug-key APK retained for CI."
          fi

      - name: Verify standard debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug-key APK for CI validation
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-debug-key
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumented debug-key APK
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-tests-debug-key
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Sign APK with Klyro certificate
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KLYRO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KLYRO_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KLYRO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLYRO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
            test -n "${!value}" || { echo "Missing signing secret: $value"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/klyro.p12"
          chmod 600 "$RUNNER_TEMP/klyro.p12"
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/klyro.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out app/build/outputs/apk/debug/klyro-shell-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/klyro-shell-signed.apk
          cp app/build/outputs/apk/debug/klyro-shell-signed.apk app/build/outputs/apk/debug/klyro-shell.apk
          "$SDK_TOOLS/zipalign" -f 4 app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/aligned-tests.apk"
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/klyro.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk "$RUNNER_TEMP/aligned-tests.apk"
          "$SDK_TOOLS/apksigner" verify --verbose app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk
          rm app/build/outputs/apk/debug/app-debug.apk
      - name: Write signed update metadata
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q :app:printKlyroVersion)"
          VERSION_CODE="${VERSION%%|*}"
          VERSION_NAME="${VERSION#*|}"
          UPDATE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          APK="app/build/outputs/apk/debug/klyro-shell.apk"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f1)"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$UPDATE_BRANCH" <<'PY'
          import json, pathlib, sys
          code, name, digest, branch = sys.argv[1:]
          data = {"packageName": "com.klyro.shell", "versionCode": int(code),
                  "versionName": name, "apkSha256": digest, "branch": branch}
          pathlib.Path("app/build/outputs/apk/debug/klyro-update.json").write_text(
              json.dumps(data, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
      - name: Upload signed debug APK
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-debug
          path: |
            app/build/outputs/apk/debug/klyro-shell.apk
            app/build/outputs/apk/debug/klyro-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumented APK with matching Klyro certificate
        if: ${{ env.KLYRO_SIGNING_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: klyro-shell-tests
          path: app/build/outputs/apk/androidTest/debug/klyro-shell-tests-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build report
        if: always()
        shell: bash
        env:
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          ANDROID_JOB_RESULT: ${{ job.status }}
        run: python3 tools/ci_build_report.py

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klyro-build-summary
          path: klyro-build-summary.md
          if-no-files-found: error
          retention-days: 14

  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require semantic version tag on main history
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download Klyro-signed APK and metadata
        uses: actions/download-artifact@v4
        with:
          name: klyro-shell-debug
          path: release-assets
      - name: Verify asset and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/klyro-shell.apk
          test -s release-assets/klyro-update.json
          python3 - "$GITHUB_REF_NAME" release-assets/klyro-update.json <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          data = json.load(open(sys.argv[2], encoding="utf-8"))
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag): raise SystemExit("Invalid release tag")
          if data.get("packageName") != "com.klyro.shell" or data.get("versionName") != tag[1:]:
              raise SystemExit("Release metadata does not match the tag")
          PY
          ACTUAL_SHA256="$(sha256sum release-assets/klyro-shell.apk | cut -d ' ' -f1)"
          EXPECTED_SHA256="$(python3 -c 'import json; print(json.load(open("release-assets/klyro-update.json"))["apkSha256"])')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/klyro-shell.apk release-assets/klyro-update.json \
            --title "$GITHUB_REF_NAME" --generate-notes

  publish-preview:
    if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        scope: [branch, global]
    concurrency:
      group: preview-publish-${{ matrix.scope == 'global' && 'global' || github.ref }}
      cancel-in-progress: false
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klyro-shell-debug
          path: release-assets
      - name: Verify and publish signed Preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SCOPE: ${{ matrix.scope }}
        shell: bash
        run: |
          set -euo pipefail
          branch_hash="$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -d ' ' -f 1)"
          tag="preview-$branch_hash"
          title="Klyro Preview · $GITHUB_REF_NAME"
          if [[ "$PREVIEW_SCOPE" == global ]]; then
            tag="preview-latest"
            title="Klyro Preview · Latest successful build"
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assets = Path("release-assets")
          metadata = json.loads((assets / "klyro-update.json").read_text())
          if (metadata["packageName"] != "com.klyro.shell"
                  or not isinstance(metadata["versionCode"], int) or metadata["versionCode"] <= 0
                  or metadata["branch"] != os.environ["GITHUB_REF_NAME"]
                  or metadata["apkSha256"] != hashlib.sha256((assets / "klyro-shell.apk").read_bytes()).hexdigest()):
              raise SystemExit("Preview metadata does not match the signed build")
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            prior="$(mktemp -d)"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern klyro-update.json --dir "$prior"
            old_code="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["versionCode"]))' "$prior/klyro-update.json")"
            new_code="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["versionCode"]))' release-assets/klyro-update.json)"
            rm -rf "$prior"
            if (( new_code <= old_code )); then
              echo "A newer or identical Preview is already published; refusing downgrade."
              exit 0
            fi
            gh release upload "$tag" release-assets/klyro-shell.apk release-assets/klyro-update.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "Signed Android build for $GITHUB_REF_NAME. CI run: $GITHUB_RUN_ID." --latest=false
          else
            gh release create "$tag" release-assets/klyro-shell.apk release-assets/klyro-update.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes "Signed Android build for $GITHUB_REF_NAME. CI run: $GITHUB_RUN_ID."
          fi
